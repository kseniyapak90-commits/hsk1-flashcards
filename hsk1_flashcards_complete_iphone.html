
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HSK1 Flashcards</title>
<style>
body{margin:0;background:#e9e5df;font-family:-apple-system;display:flex;justify-content:center;align-items:center;height:100vh}
.container{width:90%;max-width:420px;text-align:center}
.title{background:#f5a63b;padding:12px;border-radius:30px;font-size:24px;font-weight:bold;margin-bottom:20px;box-shadow:0 6px #b36a1e}
.card{width:100%;height:300px;perspective:1000px}
.inner{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.card.flip .inner{transform:rotateY(180deg)}
.side{position:absolute;width:100%;height:100%;background:#2e5b46;border-radius:25px;border:10px solid #7a5631;
display:flex;flex-direction:column;justify-content:center;align-items:center;color:white;
box-shadow:inset 0 0 0 6px #3f7a5e,0 10px 20px rgba(0,0,0,.2);backface-visibility:hidden}
.back{transform:rotateY(180deg)}
.hanzi{font-size:70px;margin-bottom:10px}
.example{background:rgba(255,255,255,.15);padding:10px 20px;border-radius:20px;font-size:22px}
.controls{margin-top:20px;display:flex;gap:15px;justify-content:center}
button{background:#e9c48c;border:none;padding:12px 25px;border-radius:30px;font-size:18px;box-shadow:0 6px #a77a40}
</style>
</head>

<body>

<div class="container">
<div class="title">📚 词语练习 (HSK一级)</div>

<div class="card" id="card">
<div class="inner">

<div class="side">
<div class="hanzi" id="hanzi"></div>
<div class="example" id="example"></div>
</div>

<div class="side back">
<div id="pinyin"></div>
<div id="translation"></div>
<br>
<div id="exampleBack"></div>
<div id="exampleRu"></div>
</div>

</div>
</div>

<div class="controls">
<button onclick="prevCard()">← 上一个</button>
<button onclick="nextCard()">下一个 →</button>
</div>

</div>

<script>

ru:"Увидимся завтра."},{hanzi:"哪",pinyin:"nǎ",translation:"какой",example:"你要哪个？",example_ru:"Какой ты хочешь?"},{hanzi:"哪里",pinyin:"nǎlǐ",translation:"где",example:"你在哪里？",example_ru:"Где ты?"},{hanzi:"你",pinyin:"nǐ",translation:"ты",example:"你好。",example_ru:"Привет."},{hanzi:"朋友",pinyin:"péngyou",translation:"друг",example:"他是我的朋友。",example_ru:"Он мой друг."},{hanzi:"苹果",pinyin:"píngguǒ",translation:"яблоко",example:"我吃苹果。",example_ru:"Я ем яблоко."},{hanzi:"七",pinyin:"qī",translation:"семь",example:"七个人。",example_ru:"Семь человек."},{hanzi:"钱",pinyin:"qián",translation:"деньги",example:"我没有钱。",example_ru:"У меня нет денег."},{hanzi:"去",pinyin:"qù",translation:"идти",example:"我去学校。",example_ru:"Я иду в школу."},{hanzi:"人",pinyin:"rén",translation:"человек",example:"很多人。",example_ru:"Много людей."},{hanzi:"三",pinyin:"sān",translation:"три",example:"三个人。",example_ru:"Три человека."},{hanzi:"上",pinyin:"shàng",translation:"на",example:"书在桌子上。",example_ru:"Книга на столе."},{hanzi:"谁",pinyin:"shéi",translation:"кто",example:"他是谁？",example_ru:"Кто он?"},{hanzi:"十",pinyin:"shí",translation:"десять",example:"十个人。",example_ru:"Десять человек."},{hanzi:"是",pinyin:"shì",translation:"быть",example:"我是学生。",example_ru:"Я студент."},{hanzi:"书",pinyin:"shū",translation:"книга",example:"我看书。",example_ru:"Я читаю книгу."},{hanzi:"水",pinyin:"shuǐ",translation:"вода",example:"我喝水。",example_ru:"Я пью воду."},{hanzi:"四",pinyin:"sì",translation:"четыре",example:"四个人。",example_ru:"Четыре человека."},{hanzi:"他",pinyin:"tā",translation:"он",example:"他是老师。",example_ru:"Он учитель."},{hanzi:"她",pinyin:"tā",translation:"она",example:"她很好。",example_ru:"Она хорошая."},{hanzi:"听",pinyin:"tīng",translation:"слушать",example:"我听音乐。",example_ru:"Я слушаю музыку."},{hanzi:"我",pinyin:"wǒ",translation:"я",example:"我是老师。",example_ru:"Я учитель."},{hanzi:"五",pinyin:"wǔ",translation:"пять",example:"五个人。",example_ru:"Пять человек."},{hanzi:"喜欢",pinyin:"xǐhuan",translation:"нравиться",example:"我喜欢中国。",example_ru:"Мне нравится Китай."},{hanzi:"现在",pinyin:"xiànzài",translation:"сейчас",example:"我现在学习。",example_ru:"Я сейчас учусь."},{hanzi:"写",pinyin:"xiě",translation:"писать",example:"我写字。",example_ru:"Я пишу."},{hanzi:"谢谢",pinyin:"xièxie",translation:"спасибо",example:"谢谢你。",example_ru:"Спасибо."},{hanzi:"学习",pinyin:"xuéxí",translation:"учиться",example:"我学习汉语。",example_ru:"Я изучаю китайский."},{hanzi:"学校",pinyin:"xuéxiào",translation:"школа",example:"我在学校。",example_ru:"Я в школе."},{hanzi:"一",pinyin:"yī",translation:"один",example:"一个人。",example_ru:"Один человек."},{hanzi:"医生",pinyin:"yīshēng",translation:"врач",example:"他是医生。",example_ru:"Он врач."},{hanzi:"医院",pinyin:"yīyuàn",translation:"больница",example:"我去医院。",example_ru:"Я иду в больницу."},{hanzi:"有",pinyin:"yǒu",translation:"иметь",example:"我有朋友。",example_ru:"У меня есть друзья."},{hanzi:"在",pinyin:"zài",translation:"находиться",example:"我在家。",example_ru:"Я дома."},{hanzi:"再见",pinyin:"zàijiàn",translation:"до свидания",example:"老师再见。",example_ru:"До свидания учитель."},{hanzi:"早上",pinyin:"zǎoshang",translation:"утром",example:"早上好。",example_ru:"Доброе утро."},{hanzi:"怎么",pinyin:"zěnme",translation:"как",example:"这个怎么说？",example_ru:"Как это сказать?"},{hanzi:"这",pinyin:"zhè",translation:"этот",example:"这是书。",example_ru:"Это книга."},{hanzi:"中国",pinyin:"Zhōngguó",translation:"Китай",example:"我爱中国。",example_ru:"Я люблю Китай."},{hanzi:"中文",pinyin:"Zhōngwén",translation:"китайский язык",example:"我学习中文。",example_ru:"Я изучаю китайский."},{hanzi:"中午",pinyin:"zhōngwǔ",translation:"полдень",example:"中午吃饭。",example_ru:"Мы едим в полдень."},{hanzi:"住",pinyin:"zhù",translation:"жить",example:"我住北京。",example_ru:"Я живу в Пекине."},{hanzi:"桌子",pinyin:"zhuōzi",translation:"стол",example:"书在桌子上。",example_ru:"Книга на столе."},{hanzi:"字",pinyin:"zì",translation:"иероглиф",example:"这个字很难。",example_ru:"Этот иероглиф трудный."},{hanzi:"坐",pinyin:"zuò",translation:"сидеть",example:"请坐。",example_ru:"Садитесь."},{hanzi:"做",pinyin:"zuò",translation:"делать",example:"我做饭。",example_ru:"Я готовлю."},{hanzi:"昨天",pinyin:"zuótiān",translation:"вчера",example:"我昨天学习。",example_ru:"Я учился вчера."}];
let index=0;

function showCard(){
document.getElementById("hanzi").innerText=cards[index].hanzi;
document.getElementById("example").innerText=cards[index].example;
document.getElementById("pinyin").innerText=cards[index].pinyin;
document.getElementById("translation").innerText=cards[index].translation;
document.getElementById("exampleBack").innerText=cards[index].example;
document.getElementById("exampleRu").innerText=cards[index].example_ru;
document.getElementById("card").classList.remove("flip");
}

function nextCard(){index++; if(index>=cards.length) index=0; showCard();}
function prevCard(){index--; if(index<0) index=cards.length-1; showCard();}

document.getElementById("card").onclick=function(){this.classList.toggle("flip")};
document.addEventListener("DOMContentLoaded", showCard);
</script>

</body>
</html>
